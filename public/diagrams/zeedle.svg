<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="Zeedle architecture diagram">
  <style>
    .t { font-family: 'IBM Plex Mono', monospace; font-size: 10px; fill: #EDE6DC; }
    .m { font-family: 'IBM Plex Mono', monospace; font-size: 9px; fill: #9A8F82; }
    .a { font-family: 'IBM Plex Mono', monospace; font-size: 9px; fill: #FF7A1A; }
    .box { fill: #1C1815; stroke: #2E2822; stroke-width: 1; }
    .lane { fill: none; stroke: #2E2822; stroke-width: 1; }
    .flow { stroke: #9A8F82; stroke-width: 1; fill: none; }
    .flow-accent { stroke: #FF7A1A; stroke-width: 1.25; fill: none; }
  </style>
  <!-- lane headers -->
  <text x="12" y="18" class="m">CLIENT</text>
  <text x="152" y="18" class="m">API</text>
  <text x="302" y="18" class="m">STATE / ASYNC</text>
  <text x="442" y="18" class="m">PROVIDERS + DB</text>
  <line x1="8" y1="26" x2="552" y2="26" class="lane"/>
  <line x1="140" y1="8" x2="140" y2="424" class="lane"/>
  <line x1="290" y1="8" x2="290" y2="424" class="lane"/>
  <line x1="430" y1="8" x2="430" y2="424" class="lane"/>

  <!-- Client nodes -->
  <rect x="12" y="44" width="112" height="40" class="box"/>
  <text x="20" y="61" class="t">Consumer app</text>
  <text x="20" y="74" class="m">Next.js · PIN · JWT</text>

  <rect x="12" y="100" width="112" height="40" class="box"/>
  <text x="20" y="117" class="t">Admin console</text>
  <text x="20" y="130" class="m">freeze · settle</text>

  <rect x="12" y="156" width="112" height="40" class="box"/>
  <text x="20" y="173" class="t">Auth bridge</text>
  <text x="20" y="186" class="m">same-origin /api</text>

  <!-- API nodes -->
  <rect x="152" y="44" width="126" height="52" class="box"/>
  <text x="160" y="62" class="t">POST /transfers</text>
  <text x="160" y="75" class="a">PIN · QueryRunner pair</text>
  <text x="160" y="87" class="m">UUID-on-the-wire</text>

  <rect x="152" y="112" width="126" height="52" class="box"/>
  <text x="160" y="130" class="t">Fund + webhook</text>
  <text x="160" y="143" class="a">HMAC-SHA512 verify</text>
  <text x="160" y="155" class="m">exactly-once credit</text>

  <rect x="152" y="180" width="126" height="52" class="box"/>
  <text x="160" y="198" class="t">Settlements</text>
  <text x="160" y="211" class="m">aggregate → assign</text>
  <text x="160" y="223" class="m">one tx · ADMIN only</text>

  <!-- State / async -->
  <rect x="302" y="44" width="116" height="52" class="box"/>
  <text x="310" y="62" class="t">Redis idempotency</text>
  <text x="310" y="75" class="m">24h keys · transfers</text>
  <text x="310" y="87" class="m">+ fund init</text>

  <rect x="302" y="112" width="116" height="52" class="box"/>
  <text x="310" y="130" class="t">Rate limits</text>
  <text x="310" y="143" class="m">auth 5 · pay 10/min</text>
  <text x="310" y="155" class="m">resolve 20/min</text>

  <rect x="302" y="180" width="116" height="40" class="box"/>
  <text x="310" y="197" class="t">Refresh rotation</text>
  <text x="310" y="210" class="m">HttpOnly cookie</text>

  <!-- Providers + DB -->
  <rect x="442" y="44" width="106" height="52" class="box"/>
  <text x="450" y="62" class="t">Postgres</text>
  <text x="450" y="75" class="m">insert-only ledger</text>
  <text x="450" y="87" class="m">kobo integers</text>

  <rect x="442" y="112" width="106" height="52" class="box"/>
  <text x="450" y="130" class="t">Paystack</text>
  <text x="450" y="143" class="m">hosted checkout</text>
  <text x="450" y="155" class="m">webhook receipts</text>

  <rect x="442" y="180" width="106" height="40" class="box"/>
  <text x="450" y="197" class="t">audit_logs</text>
  <text x="450" y="210" class="m">every admin action</text>

  <!-- Flows -->
  <!-- transfer -->
  <path d="M124 64 H152" class="flow-accent"/>
  <path d="M215 96 V112" class="flow"/>
  <path d="M278 64 H302" class="flow"/>
  <path d="M360 96 V130 H442" class="flow"/>
  <!-- fund -->
  <path d="M124 120 H152" class="flow"/>
  <path d="M278 138 H330 V112" class="flow"/>
  <path d="M442 130 H400 V164 H278" class="flow-accent"/>
  <!-- settlement -->
  <path d="M124 120 C 90 260, 90 280, 152 280" class="flow"/>
  <path d="M278 206 H330 V180" class="flow"/>
  <path d="M396 206 H442" class="flow"/>
  <!-- auth bridge -->
  <path d="M124 176 H200 V230 H360 V200" class="flow"/>

  <text x="12" y="360" class="m">REGISTER → user + wallet + 10-digit number in one tx</text>
  <text x="12" y="376" class="m">SEND → check-digit → resolve → UUID POST → PIN → QueryRunner pair → receipt</text>
  <text x="12" y="392" class="m">FUND → Paystack checkout → callback → HMAC webhook → exactly-once credit</text>
  <text x="12" y="412" class="a">ATOMIC: QueryRunner debit+credit pair — DEDUPE: x-idempotency-key — VERIFY: HMAC-SHA512</text>
</svg>
